name = "lifetime-calendar"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The built React app is uploaded as static assets. Anything that isn't a file
# (i.e. /register and /feed/*) falls through to the Worker above.
[assets]
not_found_handling = "single-page-application"

# bunx wrangler kv namespace create FEEDS
# bunx wrangler kv namespace create FEEDS --preview
[[kv_namespaces]]
binding = "FEEDS"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

[vars]
# Seconds a generated .ics is served from cache before Life Time is re-queried.
CACHE_TTL_SECONDS = "900"
# Set to "0" and redeploy once everyone has registered.
SIGNUPS_OPEN = "1"
