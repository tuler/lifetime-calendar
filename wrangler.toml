name = "lifetime-calendar"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Set explicitly so deploys don't warn about defaulting them. These are bare
# top-level keys, so they must stay above the first [table] header.
workers_dev = true
preview_urls = true

# Custom domain. Wrangler creates and manages the DNS record for this hostname
# in the tuler.dev zone; no manual CNAME is needed.
[[routes]]
pattern = "lifetime.tuler.dev"
custom_domain = true

# The built React app is uploaded as static assets. Anything that isn't a file
# (i.e. /register and /feed/*) falls through to the Worker above.
[assets]
not_found_handling = "single-page-application"

# bunx wrangler kv namespace create FEEDS
# bunx wrangler kv namespace create FEEDS --preview
[[kv_namespaces]]
binding = "FEEDS"
id = "5b15476410d94507b0717d4719e9afbb"
preview_id = "f1b039b955c44938aa2ee23c2f0488ac"

[vars]
# Seconds a generated .ics is served from cache before Life Time is re-queried.
CACHE_TTL_SECONDS = "900"
# Set to "0" and redeploy once everyone has registered.
SIGNUPS_OPEN = "1"
